<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة التحكم - BOULA CUTS</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
*{
margin: 0;
padding: 0;
box-sizing: border-box;
font-family: 'Cairo', sans-serif;
}

body{
background: linear-gradient(135deg, #0d0d0d 0%, #1a0f2e 100%);
color: white;
padding: 20px;
min-height: 100vh;
}

.container{
max-width: 1200px;
margin: 0 auto;
}

.header{
text-align: center;
margin-bottom: 50px;
}

.header h1{
font-size: 40px;
margin-bottom: 10px;
background: linear-gradient(45deg, #d4af37, #ffeb3b);
-webkit-background-clip: text;
-webkit-text-fill-color: transparent;
background-clip: text;
font-weight: 900;
}

.header p{
color: #888;
font-size: 16px;
}

.stats{
display: grid;
grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
gap: 20px;
margin-bottom: 40px;
}

.stat-card{
background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
padding: 25px;
border-radius: 20px;
border-left: 4px solid #d4af37;
text-align: center;
}

.stat-card h3{
color: #d4af37;
font-size: 32px;
margin: 10px 0;
}

.stat-card p{
color: #888;
font-size: 14px;
}

.dashboard-error{
display: none;
margin-top: 20px;
padding: 15px;
border-radius: 12px;
background: rgba(255, 107, 107, 0.16);
color: #ffb3b3;
border: 1px solid #ff6b6b;
text-align: center;
font-weight: 600;
}

.dashboard-error.show{
display: block;
}

table{
width: 100%;
margin-top: 20px;
border-collapse: collapse;
background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
border-radius: 15px;
overflow: hidden;
box-shadow: 0 10px 30px rgba(212, 175, 55, 0.2);
}

thead{
background: linear-gradient(45deg, #d4af37, #ffeb3b);
}

th{
padding: 20px;
text-align: center;
color: black;
font-weight: 700;
}

td{
padding: 15px 20px;
text-align: center;
border-bottom: 1px solid #333;
}

tbody tr:hover{
background: rgba(212, 175, 55, 0.1);
}

tbody tr:last-child td{
border-bottom: none;
}

.btn{
background: #d4af37;
color: black;
border: none;
padding: 8px 15px;
border-radius: 8px;
cursor: pointer;
font-weight: 600;
transition: 0.3s;
}

.btn:hover{
background: #ffeb3b;
transform: scale(1.05);
}

.btn-delete{
background: #ff6b6b;
color: white;
}

.btn-delete:hover{
background: #ff5252;
}

.no-data{
text-align: center;
padding: 40px;
color: #888;
}

.no-data i{
font-size: 48px;
margin-bottom: 20px;
opacity: 0.5;
}

.footer-text{
text-align: center;
margin-top: 40px;
padding-top: 20px;
border-top: 1px solid #333;
color: #888;
font-size: 14px;
}

.back-btn{
display: inline-block;
margin-bottom: 30px;
padding: 10px 20px;
background: #d4af37;
color: black;
text-decoration: none;
border-radius: 50px;
font-weight: 600;
transition: 0.3s;
}

.back-btn:hover{
box-shadow: 0 5px 15px rgba(212, 175, 55, 0.3);
transform: translateY(-2px);
}

@media(max-width: 768px){
.header h1{
font-size: 28px;
}

th, td{
padding: 12px 8px;
font-size: 14px;
}

.stats{
grid-template-columns: 1fr;
}

table{
overflow-x: auto;
display: block;
}
}

</style>
</head>

<body>

<div class="container">
<a href="index.html" class="back-btn">← العودة للموقع</a>
<a href="#" class="btn" id="logoutBtn" style="margin-left: 15px;">تسجيل خروج</a>

<div class="header">
<h1>💈 لوحة الحجوزات</h1>
<p>قائمة الحجوزات والعملاء</p>
<div id="dashboardError" class="dashboard-error"></div>
</div>

<div class="stats">
<div class="stat-card">
<i class="fas fa-users" style="font-size: 32px; color: #d4af37;"></i>
<h3 id="totalBookings">0</h3>
<p>إجمالي الحجوزات</p>
</div>
<div class="stat-card">
<i class="fas fa-check" style="font-size: 32px; color: #d4af37;"></i>
<h3 id="completedCount">0</h3>
<p>المنجزة</p>
</div>
<div class="stat-card">
<i class="fas fa-clock" style="font-size: 32px; color: #d4af37;"></i>
<h3 id="pendingCount">0</h3>
<p>قيد الانتظار</p>
</div>
</div>

<table>
<thead>
<tr>
<th>الاسم</th>
<th>الهاتف</th>
<th>الموعد</th>
<th>الخدمة</th>
<th>التاريخ</th>
<th>إجراء</th>
</tr>
</thead>

<tbody id="data">
<tr>
<td colspan="6" class="no-data">
<i class="fas fa-inbox"></i>
<p>لا توجد حجوزات حالياً</p>
</td>
</tr>
</tbody>
</table>

<div class="footer-text">
<p>© 2026 BOULA CUTS | جميع الحقوق محفوظة</p>
</div>
</div>

<script type="module" src="dashboard.js"></script>

</body>
</html>
